<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡MOA Diary♡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><span class="heart">♡</span> MOA Diary <span class="heart">♡</span></h1>
  </header>

  <main>
        <section id="page-home" class="page active">
      <div class="home-title">
        <h2>⏳ 倒数日</h2>
        <button type="button" class="btn-mode" id="btn-home-edit">编辑</button>
      </div>

      <!-- 所有卡片（由 app.js 做出来，顺序在「编辑」里调） -->
      <div id="event-list"></div>
    </section>

       <section id="page-money" class="page">
      <h2>💰 记账</h2>

      <div class="sub-tabs">
        <button type="button" class="sub-tab active" data-view="all">💰 全部</button>
        <button type="button" class="sub-tab" data-view="pending">📦 待到货</button>
      </div>

      <!-- 💰 全部 -->
      <div id="money-view-all">
        <div class="count-box">
          <p><strong>📊 统计</strong></p>
          <div class="row stats-dates">
            <label>从
              <input type="date" id="stats-from">
            </label>
            <label>到
              <input type="date" id="stats-to">
            </label>
          </div>
          <button type="button" class="btn-small btn-light" id="stats-this-month">这个月</button>

          <!-- 🍩 甜甜圈图：每一块是一个分类 -->
          <div class="donut" id="stats-donut">
            <div class="donut-hole">
              <p class="donut-label">花费</p>
              <p class="donut-total">NT$ <span id="stats-total">0</span></p>
              <p class="donut-sub">共 <span id="stats-count">0</span> 笔</p>
              <p class="donut-sub" id="stats-extra-line">含二补 NT$ <span id="stats-extra">0</span></p>
            </div>
          </div>
          <div class="cat-legend" id="stats-cats"></div>
        </div>


        <div id="money-list"></div>
      </div>

      <!-- 📦 待到货 -->
      <div id="money-view-pending" style="display: none;">
        <div class="count-box">
          <p>待二补合计</p>
          <p class="big-number">NT$ <span id="pending-extra">0</span></p>
          <p>📦 还有 <span id="pending-count">0</span> 笔还没到货</p>
        </div>

        <div id="pending-list"></div>
      </div>
    </section>

        <section id="page-diary" class="page">
      <h2>📸 记录</h2>
      <div class="sub-tabs">
        <button type="button" class="sub-tab active" data-type="concert">🎤 演唱会</button>
        <button type="button" class="sub-tab" data-type="mood">💭 心情</button>
      </div>
      <form id="diary-form">
                <label>日期
          <input type="date" id="d-date" required>
        </label>

        <div id="concert-fields">
          <label>演唱会名称
            <input type="text" id="d-title" placeholder="例如：TXT 台北演唱会 Day 1">
          </label>
          <div class="row">
            <label>地点
              <input type="text" id="d-place" placeholder="例如：台北小巨蛋">
            </label>
            <label>座位
              <input type="text" id="d-seat" placeholder="例如：A 区 12 排">
            </label>
          </div>
        </div>

        <label>写点什么
          <textarea id="d-text" rows="4" placeholder="今天的心情…"></textarea>
        </label>
        <label>照片（最多 9 张）
          <input type="file" id="d-photos" accept="image/*" multiple>
        </label>
        <div id="photo-preview" class="photo-grid"></div>
        <button type="submit" class="btn-main">记下来 ♡</button>
      </form>

      <div id="diary-list"></div>
    </section>

    <section id="page-me" class="page">
      <h2>👤 我的</h2>


      <div class="count-box">
        <p><strong>💾 资料备份</strong></p>
        <p class="rate-info">换手机、换电脑，或怕资料不见时使用</p>
        <div class="row">
          <button type="button" class="btn-small" id="btn-export">导出备份</button>
          <button type="button" class="btn-small btn-light" id="btn-import">导入备份</button>
        </div>
        <input type="file" id="import-file" accept=".json" style="display: none;">
      </div>
    </section>
  </main>

  <!-- ➕ 记一笔：从下面滑出来的画面 -->
  <div id="add-sheet" class="sheet">
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <div class="sheet-panel">

      <!-- 上面：可以上下滑 -->
      <div class="sheet-scroll">
        <div class="sheet-header">
          <strong>记一笔 ♡</strong>
          <button type="button" class="sheet-close" id="sheet-close">✕</button>
        </div>


        <form id="money-form">
          <p class="field-title">这一样的分类</p>
          <div class="cat-chips" id="cat-chips"></div>
          <input type="hidden" id="m-category" value="其他">

          <label>日期
            <input type="date" id="m-date" required>
          </label>
          <label>代购
            <input type="text" id="m-agent" placeholder="例如：小明代购">
          </label>
          <label>购买平台
            <input type="text" id="m-platform" placeholder="例如：Weverse Shop">
          </label>

        
                      <label>运输方式
            <select id="m-shipping">
              <option value="">无</option>
              <option value="空运">✈️ 空运</option>
              <option value="海运">🚢 海运</option>
            </select>
          </label>

          <label>状态
            <select id="m-status">
                            <option value="货到付款">💰 货到付款</option>
              <option value="已付款" selected>💳 已付款</option>
              <option value="已发货">🚚 已发货</option>
              <option value="完成">✅ 完成（已经拿到了）</option>
            </select>
          </label>
          <label>备注
            <textarea id="m-note" rows="2"></textarea>
          </label>
        </form>
      </div>

      <!-- 下面：固定不动 -->
      <div class="sheet-bottom">
        <div class="cur-chips" id="cur-chips"></div>
        <div class="cart-list" id="calc-list"></div>
        <div class="amount-box">
          <p class="amount-expr" id="amount-expr"></p>
          <p class="amount-display"><span id="amount-label"></span>NT$ <span id="amount-text">0</span></p>
        </div>
        <input type="text" id="calc-name" class="calc-name" placeholder="这一样的名称（选填，例如：yj 小卡）">
        <input type="hidden" id="m-amount">

        <div class="keypad">
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="back" class="key-fn">⌫</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="add" class="key-fn key-add">＋加入</button>
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="clear" class="key-fn">C</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="00">00</button>
          <button type="submit" form="money-form" class="key-submit">✓ 记一笔</button>
        </div>
      </div>

    </div>
  </div>
  <!-- ⏳ 倒数管理：从下面滑出来的画面 -->
  <div id="event-sheet" class="sheet">
    <div class="sheet-backdrop" id="event-sheet-backdrop"></div>
    <div class="sheet-panel">
      <div class="sheet-scroll">
        <div class="sheet-header">
          <strong>⏳ 倒数管理</strong>
          <button type="button" class="sheet-close" id="event-sheet-close">✕</button>
        </div>
        <p class="rate-info">↑ ↓ 调整首页的顺序</p>
        <div id="event-manager"></div>
        <button type="button" class="btn-small btn-light" id="btn-add-event">＋ 新增倒数</button>
      </div>
    </div>
  </div>

    <nav class="tab-bar">
    <button class="active" data-page="page-home">🏠<br>首页</button>
    <button data-page="page-money">💰<br>记账</button>
    <button class="tab-add" id="btn-add">＋</button>
    <button data-page="page-diary">📸<br>记录</button>
    <button data-page="page-me">👤<br>我的</button>
  </nav>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
